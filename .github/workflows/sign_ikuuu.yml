name: iKuuu Cookie 自动签到

on:
  schedule:
    - cron: '10 23 * * *' # 香港时间每天 07:10；GitHub 调度可能延迟
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ikuuu-checkin
  cancel-in-progress: false

jobs:
  checkin:
    name: 验证登录会话并签到
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Hong_Kong
      PYTHONUNBUFFERED: '1'
    steps:
      - name: 检出运行配置
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 检查 Cookie 配置
        env:
          IKUUU_COOKIE: ${{ secrets.IKUUU_COOKIE }}
          IKUUU_BASE_URL: ${{ vars.IKUUU_BASE_URL || 'https://ikuuu.top' }}
        run: python scripts/run_ikuuu_cookie.py --check-config

      - name: 设置 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: 检查服务端结果判定
        run: python -m unittest discover -s tests -v

      - name: 执行签到并验证服务端结果
        env:
          IKUUU_COOKIE: ${{ secrets.IKUUU_COOKIE }}
          IKUUU_BASE_URL: ${{ vars.IKUUU_BASE_URL || 'https://ikuuu.top' }}
        run: python scripts/run_ikuuu_cookie.py
