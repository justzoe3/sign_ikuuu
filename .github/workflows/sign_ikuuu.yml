name: iKuuu Actions 独立签到
on:
  schedule:
    - cron: '10 23 * * *' # 香港时间 07:10
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ikuuu-checkin
  cancel-in-progress: false
jobs:
  checkin:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TZ: Asia/Hong_Kong
      IKUUU_MODEL_DIR: .models
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: 检查仓库凭证配置
        id: config
        env:
          ACCOUNTS: ${{ secrets.ACCOUNTS }}
          IKUUU_COOKIE: ${{ secrets.IKUUU_COOKIE }}
        run: python scripts/run_actions.py --check-config
      - name: 安装免费浏览器和本地识别依赖
        if: steps.config.outputs.mode == 'account'
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: 缓存公开识别模型
        if: steps.config.outputs.mode == 'account'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .models
          key: ikuuu-models-v1-${{ hashFiles('scripts/ikuuu_models.py') }}
      - name: 下载并核对模型 SHA-256
        if: steps.config.outputs.mode == 'account'
        run: python scripts/ikuuu_models.py --directory .models
      - name: 独立登录、签到并核对网站响应
        env:
          ACCOUNTS: ${{ secrets.ACCOUNTS }}
          IKUUU_COOKIE: ${{ secrets.IKUUU_COOKIE }}
        run: python scripts/run_actions.py
