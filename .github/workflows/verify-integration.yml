name: iKuuu 集成自检（不登录）
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: 检查登录与签到结果判定
        run: python -m unittest discover -s tests -v
      - name: 安装加密交叉验证依赖
        run: python -m pip install --disable-pip-version-check 'PyNaCl==1.6.2'
      - name: 验证扩展同步和 GitHub 加密兼容性
        run: python scripts/check_extension.py
