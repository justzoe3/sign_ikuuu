name: iKuuu Actions 独立项目自检
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      IKUUU_MODEL_DIR: .models
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
      - name: 检查现有凭证格式（不登录）
        env:
          ACCOUNTS: ${{ secrets.ACCOUNTS }}
          IKUUU_COOKIE: ${{ secrets.IKUUU_COOKIE }}
        run: python scripts/run_actions.py --check-config
      - name: 安装固定版本的免费依赖
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: 检查登录状态与签到结果判定
        run: python -m unittest discover -s tests -v
      - name: 在真实 Chrome 中测试独立登录客户端
        run: python scripts/check_browser.py
      - name: 缓存公开模型
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .models
          key: ikuuu-models-v1-${{ hashFiles('scripts/ikuuu_models.py') }}
      - name: 下载并校验免费本地模型
        run: python scripts/ikuuu_models.py --directory .models
      - name: 检查 CPU 模型运行时
        run: |
          PYTHONPATH=scripts python - <<'PYCODE'
          from ikuuu_recognition import NineRecognizer, WordRecognizer
          NineRecognizer()
          WordRecognizer()
          print('三个固定 SHA-256 模型均已在 CPU 加载成功。该检查不代表真实网站验证成功。')
          PYCODE
