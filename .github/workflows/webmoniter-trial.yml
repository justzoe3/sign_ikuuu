name: iKuuu WebMoniter 试运行

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ikuuu-checkin
  cancel-in-progress: false

jobs:
  checkin:
    name: 自动登录与本地验证码签到测试
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      TZ: Asia/Hong_Kong
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - name: 检出测试配置
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 检查现有账号配置
        env:
          ACCOUNTS: ${{ secrets.ACCOUNTS }}
        run: python scripts/run_webmoniter.py --check-config

      - name: 设置 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: 检出已审阅的 WebMoniter 版本
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 666fy666/WebMoniter
          ref: 80cb2c178d5d7bd0156b9f0ac83ff1521e2fe8a4
          path: .upstream/WebMoniter
          persist-credentials: false

      - name: 安装锁定的运行依赖
        working-directory: .upstream/WebMoniter
        run: |
          python -m pip install --disable-pip-version-check uv
          uv sync --locked --extra rainyun --no-dev

      - name: 检查 GitHub Runner 预装的浏览器与驱动
        run: |
          python - <<'PY'
          import os, shutil, subprocess
          from pathlib import Path
          chrome = shutil.which('google-chrome') or shutil.which('chromium')
          driver = shutil.which('chromedriver') or str(Path(os.environ['CHROMEWEBDRIVER']) / 'chromedriver')
          assert chrome and Path(driver).is_file(), '缺少浏览器或驱动'
          for binary in (chrome, driver):
              subprocess.run([binary, '--version'], check=True)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'CHROME_BIN={chrome}\nCHROMEDRIVER_PATH={driver}\n')
          PY

      - name: 下载并校验本地验证码模型
        working-directory: .upstream/WebMoniter
        run: .venv/bin/python -m src.tasks.ikuuu_models --directory data/models/ikuuu

      - name: 自动登录与签到并核实服务端结果
        env:
          ACCOUNTS: ${{ secrets.ACCOUNTS }}
        run: .upstream/WebMoniter/.venv/bin/python scripts/run_webmoniter.py
